name: Update Profile Assets

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          curl -L \
            -H "User-Agent: GitHub Actions" \
            "https://github-readme-stats.vercel.app/api?username=ARUNMANIKANDAN-C&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" \
            -o assets/stats.svg

      - name: Download Top Languages
        run: |
          curl -L \
            -H "User-Agent: GitHub Actions" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=ARUNMANIKANDAN-C&layout=compact&theme=tokyonight&hide_border=true" \
            -o assets/languages.svg

      - name: Download GitHub Streak
        run: |
          curl -L \
            -H "User-Agent: GitHub Actions" \
            "https://streak-stats.demolab.com?user=ARUNMANIKANDAN-C&theme=tokyonight&hide_border=true" \
            -o assets/streak.svg

      - name: Download Capsule Header
        run: |
          curl -L \
            -H "User-Agent: GitHub Actions" \
            "https://capsule-render.vercel.app/api?type=waving&color=0:00C9FF,100:92FE9D&height=220&section=header&text=ARUNMANIKANDAN%20C&fontSize=52&fontColor=ffffff&animation=fadeIn" \
            -o assets/header.svg

      - name: Download Skill Icons
        run: |
          curl -L \
            -H "User-Agent: GitHub Actions" \
            "https://skillicons.dev/icons?i=python,cpp,java,tensorflow,pytorch,opencv,docker,git,linux,fastapi,supabase&perline=11" \
            -o assets/skills.svg

      - name: Verify SVG Files
        run: |
          for file in assets/*.svg; do
            echo "Checking $file"
            grep -q "<svg" "$file" || (echo "Invalid SVG: $file" && exit 1)
          done

      - name: Commit Updated Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(profile): update generated assets"
          file_pattern: assets/*.svg
